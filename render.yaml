services:
  - type: web
    name: verapath
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn leakfix_mvp.leakfix.wsgi:application"
    healthCheckPath: "/"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: verapath-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: PYTHON_VERSION
        value: 3.9
      - key: DJANGO_SETTINGS_MODULE
        value: leakfix_mvp.leakfix.settings
      - key: PRODUCTION
        value: "True"

databases:
  - name: verapath-db
    plan: free
    postgresMajorVersion: 14
