{% extends 'base.html' %}

{% block content %}
<style>
    /* Existing styles... */
    .help-icon {
        display: inline-block;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background-color: #6c757d;
        color: white;
        text-align: center;
        font-size: 12px;
        line-height: 16px;
        cursor: help;
        position: relative;
        margin-left: 5px;
    }
    .help-icon .tooltip-text {
        visibility: hidden;
        width: 220px;
        background-color: #343a40;
        color: #fff;
        text-align: center;
        border-radius: 6px;
        padding: 8px;
        position: absolute;
        z-index: 1;
        bottom: 125%;
        left: 50%;
        margin-left: -110px;
        opacity: 0;
        transition: opacity 0.3s;
        font-size: 12px;
        font-weight: normal;
    }
    .help-icon:hover .tooltip-text {
        visibility: visible;
        opacity: 1;
    }
</style>

<h2>Create Referral</h2>
<form id="new-referral-form">
  {% csrf_token %}
  <table>
    <!-- Manually rendering fields to add help icons and custom inputs -->
    <tr>
        <th><label for="patient-search-input">Patient</label></th>
        <td>
            <input type="text" id="patient-search-input" placeholder="Search patient by name or ID" style="width: 40%; padding: 0.5rem;" />
            <input type="hidden" name="patient_id" id="id_patient_id" />
            <div id="patient-search-results" style="border: 1px solid #ccc; max-height: 150px; overflow-y: auto; display: none; position: absolute; background-color: white; width: 40%; z-index: 100;"></div>
        </td>
    </tr>
    <tr>
        <th><label for="id_specialty">Specialty</label></th>
        <td>
            {{ form.specialty }}
            <small style="display: block; color: #666;">{{ form.specialty.help_text }}</small>
        </td>
    </tr>
    <tr>
        <th><label for="id_provider">Provider</label></th>
        <td>
            <select name="provider" id="id_provider" style="width: 100%; padding: 0.5rem;">
                <option value="">--- select provider ---</option>
            </select>
        </td>
    </tr>
    <tr>
        <th><label for="id_department">Department</label></th>
        <td>
            <select name="department" id="id_department" style="width: 100%; padding: 0.5rem;">
                <option value="">--- select department ---</option>
            </select>
            <small style="display: block; color: #666;">{{ form.department.help_text }}</small>
        </td>
    </tr>
    <tr>
        <th>
            <label for="ordertype-search-input">Referral Order Type</label>
            <div class="help-icon">?
                <span class="tooltip-text">{{ form.ordertypeid.help_text }}</span>
            </div>
        </th>
        <td>
            <input type="text" id="ordertype-search-input" placeholder="Search for the clinical service to order" style="width: 100%; padding: 0.5rem;" />
            <input type="hidden" name="ordertypeid" id="id_ordertypeid" />
            <div id="ordertype-search-results" style="border: 1px solid #ccc; max-height: 150px; overflow-y: auto; display: none; position: absolute; background-color: white; width: 100%; z-index: 100;"></div>
            <span id="ordertype-loading-indicator" style="display: none; margin-left: 5px;" class="animated-dots"><span>.</span><span>.</span><span>.</span></span>
        </td>
    </tr>
    <tr>
        <th><label for="id_patient_insurance_id">Payer (optional)</label></th>
        <td>
            <select name="patient_insurance_id" id="id_patient_insurance_id" style="width: 100%; padding: 0.5rem;">
                <option value="">--- select a patient first ---</option>
            </select>
        </td>
    </tr>
    <tr>
        <th><label for="id_is_urgent">Is Urgent</label></th>
        <td><input type="checkbox" name="is_urgent" id="id_is_urgent"></td>
    </tr>
    <tr>
        <th><label for="id_provider_note">Note to Provider (optional)</label></th>
        <td><textarea name="provider_note" id="id_provider_note" rows="3" style="width: 100%;"></textarea></td>
    </tr>
    <tr>
        <th><label for="id_note_to_patient">Note to Patient (optional)</label></th>
        <td><textarea name="note_to_patient" id="id_note_to_patient" rows="3" style="width: 100%;"></textarea></td>
    </tr>
  </table>
  <input type="hidden" id="selected_date" name="selected_date">
  
  <div style="margin-top: 1rem;">
      <label for="date-input-display">Suggested Date (optional)</label>
      <div id="date-selector-ui" style="display: flex; align-items: center; position: relative;">
          <input type="text" id="date-input-display" placeholder="MM/DD/YYYY" style="padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
          <div id="calendar-wrapper" style="display: none; position: absolute; top: 100%; left: 0; background-color: white; border: 1px solid #ccc; z-index: 1000; padding: 1rem;">
              <div style="display: flex; align-items: center;">
                  <h4>Date of Service (optional)</h4>
                  <small style="margin-left: 1rem; color: #666;">* = Dates with open slots</small>
              </div>
              <div id="calendar-container" style="max-width: 600px;">
                  <!-- Calendar will be generated here by JS -->
              </div>
          </div>
      </div>
  </div>

  <button type="button" id="create-referral-btn" class="action-btn book-btn" style="margin-top: 1rem;">Create Referral</button>
</form>

<style>
    /* CSS for animated dots */
    .animated-dots span {
        opacity: 0;
        animation: blink 1.4s infinite;
    }

    .animated-dots span:nth-child(2) { animation-delay: 0.2s; }
    .animated-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
        0% { opacity: 0; }
        50% { opacity: 1; }
        100% { opacity: 0; }
    }

    /* Styling for specialty dropdown */
    select[name="specialty"] {
        width: 100%;
        padding: 0.5rem;
    }

    /* Base button styling */
    .action-btn {
        color: #fff;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.2s ease;
    }

    /* Book button specific styling */
    .book-btn {
        background-color: #0d6efd; /* Blue */
    }

    .book-btn:hover:not(:disabled) {
        background-color: #0a58ca; /* Darker blue on hover */
    }

    /* Cancel button specific styling (enabled) */
    .cancel-action-btn {
        background-color: #6c757d; /* Gray */
    }

    .cancel-action-btn:hover:not(:disabled) {
        background-color: #5a6268; /* Darker gray on hover */
    }

    /* Disabled state for all action buttons */
    .action-btn:disabled {
        background-color: #adb5bd; /* Light gray when disabled */
        cursor: not-allowed;
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Form elements
        const form = document.getElementById('new-referral-form');
        const patientIdInput = document.getElementById('id_patient_id');
        const patientSearchInput = document.getElementById('patient-search-input');
        const patientSearchResults = document.getElementById('patient-search-results');
        const specialtyInput = form.querySelector('[name="specialty"]');
        const providerSelect = form.querySelector('[name="provider"]');
        const departmentSelect = form.querySelector('[name="department"]');
        const patientInsuranceSelect = document.getElementById('id_patient_insurance_id');
        const ordertypeIdInput = document.getElementById('id_ordertypeid');
        const ordertypeSearchInput = document.getElementById('ordertype-search-input');
        const ordertypeSearchResults = document.getElementById('ordertype-search-results');
        const ordertypeLoadingIndicator = document.getElementById('ordertype-loading-indicator');
        const selectedDateInput = document.getElementById('selected_date');
        let searchTimeout;
        let ordertypeSearchTimeout;

        // Buttons
        const createReferralBtn = document.getElementById('create-referral-btn');

        // Date Selector UI
        const dateInputDisplay = document.getElementById('date-input-display');
        const calendarWrapper = document.getElementById('calendar-wrapper');
        
        // Calendar elements
        const calendarContainer = document.getElementById('calendar-container');
        let currentDate = new Date();
        const calendarCache = {}; // Cache for monthly availability

        const STORAGE_KEYS = {
            PROVIDER: 'newReferralProvider',
            DEPARTMENT: 'newReferralDepartment',
            ORDER_TYPE_ID: 'newReferralOrderTypeId',
            ORDER_TYPE_NAME: 'newReferralOrderTypeName',
            PATIENT_ID: 'newReferralPatientId',
            PATIENT_NAME: 'newReferralPatientName',
            PAYER_CODE: 'newReferralPayerCode', // This will now store patientinsuranceid
        };

        function saveFormState() {
            sessionStorage.setItem(STORAGE_KEYS.PROVIDER, providerSelect.value);
            sessionStorage.setItem(STORAGE_KEYS.DEPARTMENT, departmentSelect.value);
            sessionStorage.setItem(STORAGE_KEYS.ORDER_TYPE_ID, ordertypeIdInput.value);
            sessionStorage.setItem(STORAGE_KEYS.ORDER_TYPE_NAME, ordertypeSearchInput.value);
            sessionStorage.setItem(STORAGE_KEYS.PATIENT_ID, patientIdInput.value);
            sessionStorage.setItem(STORAGE_KEYS.PATIENT_NAME, patientSearchInput.value);
            sessionStorage.setItem(STORAGE_KEYS.PAYER_CODE, patientInsuranceSelect.value);
        }

        function loadFormState() {
            const storedProvider = sessionStorage.getItem(STORAGE_KEYS.PROVIDER);
            if (storedProvider) providerSelect.value = storedProvider;
            const storedOrderTypeId = sessionStorage.getItem(STORAGE_KEYS.ORDER_TYPE_ID);
            if (storedOrderTypeId) ordertypeIdInput.value = storedOrderTypeId;
            const storedOrderTypeName = sessionStorage.getItem(STORAGE_KEYS.ORDER_TYPE_NAME);
            if (storedOrderTypeName) ordertypeSearchInput.value = storedOrderTypeName;
            const storedPatientId = sessionStorage.getItem(STORAGE_KEYS.PATIENT_ID);
            if (storedPatientId) {
                patientIdInput.value = storedPatientId;
                fetchAndPopulateInsurances(storedPatientId); // Fetch insurances on load
            }
            const storedPatientName = sessionStorage.getItem(STORAGE_KEYS.PATIENT_NAME);
            if (storedPatientName) patientSearchInput.value = storedPatientName;
            // Payer is loaded via fetchAndPopulateInsurances
        }

        async function fetchAndPopulateInsurances(patientId) {
            if (!patientId) {
                patientInsuranceSelect.innerHTML = '<option value="">--- select a patient first ---</option>';
                return;
            }
            patientInsuranceSelect.innerHTML = '<option value="">--- loading insurances ---</option>';
            patientInsuranceSelect.disabled = true;
            try {
                const response = await fetch(`/analytics/patient-insurances/${patientId}/`);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const insurances = await response.json();
                patientInsuranceSelect.innerHTML = '<option value="">--- select payer ---</option>';
                if (insurances.length > 0) {
                    insurances.forEach(ins => {
                        const option = document.createElement('option');
                        option.value = ins.id;
                        option.textContent = ins.name;
                        patientInsuranceSelect.appendChild(option);
                    });
                } else {
                    patientInsuranceSelect.innerHTML = '<option value="">--- no insurances found ---</option>';
                }
                patientInsuranceSelect.disabled = false;
                const storedPayer = sessionStorage.getItem(STORAGE_KEYS.PAYER_CODE);
                if (storedPayer) {
                    patientInsuranceSelect.value = storedPayer;
                }
            } catch (error) {
                console.error('Error fetching patient insurances:', error);
                patientInsuranceSelect.innerHTML = '<option value="">--- error loading insurances ---</option>';
            }
        }

        async function fetchAndPopulateDepartments(providerId) {
            departmentSelect.innerHTML = '<option value="">--- loading departments ---</option>';
            departmentSelect.disabled = true;
            try {
                const url = providerId ? `/analytics/provider-departments/${providerId}/` : '/analytics/provider-departments/';
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const departments = await response.json();
                departmentSelect.innerHTML = '<option value="">--- select department ---</option>';
                departments.forEach((dept, index) => {
                    const option = document.createElement('option');
                    option.value = dept.id;
                    option.textContent = dept.name;
                    if (index === 0) option.textContent += ' * most often department';
                    departmentSelect.appendChild(option);
                });
                departmentSelect.disabled = false;
                const storedDepartment = sessionStorage.getItem(STORAGE_KEYS.DEPARTMENT);
                if (storedDepartment) {
                    departmentSelect.value = storedDepartment;
                }
            } catch (error) {
                console.error('Error fetching departments:', error);
                departmentSelect.innerHTML = '<option value="">--- error loading departments ---</option>';
            }
        }

        function displayPatientSearchResults(patients) {
            patientSearchResults.innerHTML = '';
            if (patients.length > 0) {
                patients.forEach(patient => {
                    const resultItem = document.createElement('div');
                    resultItem.style.padding = '8px';
                    resultItem.style.cursor = 'pointer';
                    resultItem.textContent = `${patient.name} (ID: ${patient.patientid})`;
                    resultItem.dataset.patientId = patient.patientid;
                    resultItem.dataset.patientName = patient.name;
                    resultItem.addEventListener('click', (event) => {
                        const patientId = event.target.dataset.patientId;
                        patientSearchInput.value = event.target.dataset.patientName;
                        patientIdInput.value = patientId;
                        patientSearchResults.style.display = 'none';
                        fetchAndPopulateInsurances(patientId); // Fetch insurances when patient is selected
                        saveFormState();
                    });
                    patientSearchResults.appendChild(resultItem);
                });
                patientSearchResults.style.display = 'block';
            } else {
                patientSearchResults.innerHTML = '<div style="padding: 8px;">No patients found.</div>';
                patientSearchResults.style.display = 'block';
            }
        }

        function displayOrderTypeSearchResults(orderTypes) {
            ordertypeSearchResults.innerHTML = '';
            if (orderTypes.length > 0) {
                orderTypes.forEach(orderType => {
                    const resultItem = document.createElement('div');
                    resultItem.style.padding = '8px';
                    resultItem.style.cursor = 'pointer';
                    resultItem.textContent = `${orderType.name} (ID: ${orderType.id})`;
                    resultItem.dataset.ordertypeId = orderType.id;
                    resultItem.dataset.ordertypeName = orderType.name;
                    resultItem.addEventListener('click', (event) => {
                        ordertypeSearchInput.value = event.target.dataset.ordertypeName;
                        ordertypeIdInput.value = event.target.dataset.ordertypeId;
                        ordertypeSearchResults.style.display = 'none';
                        saveFormState();
                    });
                    ordertypeSearchResults.appendChild(resultItem);
                });
                ordertypeSearchResults.style.display = 'block';
            } else {
                ordertypeSearchResults.innerHTML = '<div style="padding: 8px;">No order types found.</div>';
                ordertypeSearchResults.style.display = 'block';
            }
        }

        async function autoPopulateSpecialty() {
            const selectedProviderId = providerSelect.value;
            if (selectedProviderId) {
                try {
                    const response = await fetch(`/analytics/provider-details/${selectedProviderId}/`);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const providerDetails = await response.json();
                    specialtyInput.value = providerDetails.specialty || '';
                } catch (error) {
                    console.error('Error fetching provider details:', error);
                    specialtyInput.value = '';
                }
            } else {
                specialtyInput.value = '';
            }
        }

        async function sortProviderDropdown() {
            const selectedSpecialty = specialtyInput.value;
            let url = '{% url "analytics:get_sorted_providers_ajax" %}';
            if (selectedSpecialty) {
                url += `?specialty=${encodeURIComponent(selectedSpecialty)}`;
            }
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const sortedProviders = await response.json();
                const currentProviderValue = providerSelect.value;
                providerSelect.innerHTML = '<option value="">--- select provider ---</option>';
                sortedProviders.forEach(provider => {
                    const option = document.createElement('option');
                    option.value = provider.providerid;
                    option.dataset.npi = provider.npi;
                    option.textContent = provider.full_name + (provider.specialty ? ` (${provider.specialty})` : '');
                    providerSelect.appendChild(option);
                });
                if (currentProviderValue) {
                    providerSelect.value = currentProviderValue;
                }
            } catch (error) {
                console.error('Error sorting providers:', error);
            }
        }

        // --- Calendar Functions ---
        function renderCalendar(year, month, availableDates, isLoading = false) {
            calendarContainer.innerHTML = ''; // Clear previous calendar

            const header = document.createElement('div');
            header.style.display = 'flex';
            header.style.justifyContent = 'space-between';
            header.style.alignItems = 'center';
            header.style.marginBottom = '1rem';

            const prevButton = document.createElement('button');
            prevButton.textContent = '<';
            prevButton.addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() - 1);
                fetchAndRenderCalendar(currentDate.getFullYear(), currentDate.getMonth());
            });

            const monthYearLabel = document.createElement('h4');
            monthYearLabel.textContent = `${new Date(year, month).toLocaleString('default', { month: 'long' })} ${year}`;

            if (isLoading) {
                const loadingSpan = document.createElement('span');
                loadingSpan.textContent = ' (Loading...)';
                loadingSpan.style.fontSize = '0.9rem';
                loadingSpan.style.color = '#666';
                monthYearLabel.appendChild(loadingSpan);
            }

            const nextButton = document.createElement('button');
            nextButton.textContent = '>';
            nextButton.addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() + 1);
                fetchAndRenderCalendar(currentDate.getFullYear(), currentDate.getMonth());
            });

            header.appendChild(prevButton);
            header.appendChild(monthYearLabel);
            header.appendChild(nextButton);
            calendarContainer.appendChild(header);

            const table = document.createElement('table');
            table.style.width = '100%';
            table.style.borderCollapse = 'collapse';

            const thead = document.createElement('thead');
            const daysOfWeek = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const trHead = document.createElement('tr');
            daysOfWeek.forEach(day => {
                const th = document.createElement('th');
                th.textContent = day;
                th.style.textAlign = 'center';
                th.style.padding = '0.5rem';
                trHead.appendChild(th);
            });
            thead.appendChild(trHead);
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            let date = 1;

            for (let i = 0; i < 6; i++) {
                const tr = document.createElement('tr');
                for (let j = 0; j < 7; j++) {
                    const td = document.createElement('td');
                    td.style.border = '1px solid #ddd';
                    td.style.padding = '1rem';
                    td.style.textAlign = 'center';
                    td.style.cursor = 'pointer';

                    if (i === 0 && j < firstDay) {
                        // Empty cells before the first day
                    } else if (date > daysInMonth) {
                        // Empty cells after the last day
                    } else {
                        td.textContent = date;
                        const dateStringForDataset = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
                        td.dataset.date = dateStringForDataset; 

                        const dateStringForDisplay = `${String(month + 1).padStart(2, '0')}/${String(date).padStart(2, '0')}/${year}`;
                        if (availableDates.has(dateStringForDisplay)) {
                            td.textContent += ' *';
                            td.style.fontWeight = 'bold';
                        }
                        
                        td.addEventListener('click', (e) => {
                            const [y, m, d] = e.target.dataset.date.split('-');
                            dateInputDisplay.value = `${m}/${d}/${y}`;
                            selectedDateInput.value = e.target.dataset.date;
                            calendarWrapper.style.display = 'none';
                        });
                        date++;
                    }
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
                if (date > daysInMonth) break;
            }
            table.appendChild(tbody);
            calendarContainer.appendChild(table);
        }

        async function fetchAndRenderCalendar(year, month) {
            const cacheKey = `${year}-${month}`;
            if (calendarCache[cacheKey]) {
                renderCalendar(year, month, calendarCache[cacheKey], false);
                return;
            }

            renderCalendar(year, month, new Set(), true); // Render with loading indicator

            const providerId = providerSelect.value;
            const departmentId = departmentSelect.value;

            if (!providerId || !departmentId) {
                return; // Already rendered empty calendar
            }

            try {
                const params = new URLSearchParams();
                params.append('provider_id', providerId);
                params.append('department_id', departmentId);
                
                const startDate = new Date(year, month, 1);
                const endDate = new Date(year, month + 1, 0);
                params.append('startdate', `${String(startDate.getMonth() + 1).padStart(2, '0')}/${String(startDate.getDate()).padStart(2, '0')}/${startDate.getFullYear()}`);
                params.append('enddate', `${String(endDate.getMonth() + 1).padStart(2, '0')}/${String(endDate.getDate()).padStart(2, '0')}/${endDate.getFullYear()}`);

                const response = await fetch(`{% url 'analytics:find_provider_slots' %}?${params.toString()}`);
                if (!response.ok) throw new Error('Failed to fetch slots');
                const slots = await response.json();

                const datesWithSlots = new Set();
                slots.forEach(slot => {
                    datesWithSlots.add(slot.date);
                });

                calendarCache[cacheKey] = datesWithSlots; // Store in cache
                renderCalendar(year, month, datesWithSlots, false); // Re-render with data
            } catch (error) {
                console.error('Error fetching availability:', error);
                renderCalendar(year, month, new Set(), false); // Re-render without data on error
            }
        }

        // --- Event Listeners ---
        dateInputDisplay.addEventListener('focus', () => {
            calendarWrapper.style.display = 'block';
        });

        document.addEventListener('click', (event) => {
            if (!calendarWrapper.contains(event.target) && event.target !== dateInputDisplay) {
                calendarWrapper.style.display = 'none';
            }
        });

        dateInputDisplay.addEventListener('change', () => {
            const dateParts = dateInputDisplay.value.split('/');
            if (dateParts.length === 3) {
                const [month, day, year] = dateParts;
                if (month && day && year && year.length === 4) {
                    selectedDateInput.value = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                } else {
                    selectedDateInput.value = '';
                }
            } else {
                selectedDateInput.value = '';
            }
        });
        
        patientInsuranceSelect.addEventListener('change', saveFormState);

        providerSelect.addEventListener('change', () => {
            saveFormState();
            Object.keys(calendarCache).forEach(key => delete calendarCache[key]); // Clear cache
            fetchAndPopulateDepartments(providerSelect.value).then(() => {
                fetchAndRenderCalendar(currentDate.getFullYear(), currentDate.getMonth());
            });
        });

        departmentSelect.addEventListener('change', () => {
            saveFormState();
            Object.keys(calendarCache).forEach(key => delete calendarCache[key]); // Clear cache
            fetchAndRenderCalendar(currentDate.getFullYear(), currentDate.getMonth());
        });

        patientSearchInput.addEventListener('keyup', () => {
            clearTimeout(searchTimeout);
            const query = patientSearchInput.value.trim();
            patientSearchResults.style.display = 'none';
            patientSearchResults.innerHTML = '';
            if (query.length < 2) {
                // Clear patient-dependent fields if search is cleared
                patientIdInput.value = '';
                fetchAndPopulateInsurances(null);
                saveFormState();
                return;
            }
            searchTimeout = setTimeout(async () => {
                try {
                    const response = await fetch(`{% url 'analytics:patient_search_ajax' %}?query=${encodeURIComponent(query)}`);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const patients = await response.json();
                    displayPatientSearchResults(patients);
                } catch (error) {
                    console.error('Error searching patients:', error);
                }
            }, 300);
        });

        ordertypeSearchInput.addEventListener('keyup', () => {
            clearTimeout(ordertypeSearchTimeout);
            ordertypeSearchResults.style.display = 'none';
            ordertypeSearchResults.innerHTML = '';
            ordertypeIdInput.value = '';
            saveFormState();
            const query = ordertypeSearchInput.value.trim();
            if (query.length < 2) return;
            ordertypeSearchTimeout = setTimeout(async () => {
                ordertypeLoadingIndicator.style.display = 'inline';
                try {
                    const response = await fetch(`{% url 'analytics:search_appointment_reasons_ajax' %}?query=${encodeURIComponent(query)}`);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const orderTypes = await response.json();
                    displayOrderTypeSearchResults(orderTypes);
                } catch (error) {
                    console.error('Error searching order types:', error);
                } finally {
                    ordertypeLoadingIndicator.style.display = 'none';
                }
            }, 300);
        });

        specialtyInput.addEventListener('change', () => {
            saveFormState();
            sortProviderDropdown();
        });

        createReferralBtn.addEventListener('click', async () => {
            const selectedProviderOption = providerSelect.options[providerSelect.selectedIndex];
            const providerId = selectedProviderOption ? selectedProviderOption.value : '';
            const patientId = patientIdInput.value;
            const orderTypeId = ordertypeIdInput.value;
            const patientInsuranceId = patientInsuranceSelect.value;
            const specialty = specialtyInput.value;
            const selectedDate = selectedDateInput.value;
            const isUrgent = document.getElementById('id_is_urgent').checked;
            const providerNote = document.getElementById('id_provider_note').value;
            const noteToPatient = document.getElementById('id_note_to_patient').value;

            if (!patientId || !providerId || !orderTypeId) {
                alert('Patient, Provider, and Referral Order Type are required.');
                return;
            }

            createReferralBtn.disabled = true;
            createReferralBtn.textContent = 'Creating...';

            try {
                const referralOrderPayload = {
                    patient_id: patientId,
                    provider_id: providerId,
                    ordertypeid: orderTypeId,
                    patientinsuranceid: patientInsuranceId,
                    specialty: specialty,
                    department_id: departmentSelect.value,
                    is_urgent: isUrgent,
                    providernote: providerNote,
                    notetopatient: noteToPatient,
                };

                if (selectedDate) {
                    const [year, month, day] = selectedDate.split('-');
                    referralOrderPayload.dateofservice = `${month}/${day}/${year}`;
                }
                
                console.log('Sending referral payload:', referralOrderPayload);

                const response = await fetch('{% url "analytics:create_referral_order_ajax" %}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}',
                    },
                    body: JSON.stringify(referralOrderPayload),
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to create referral.');
                }

                const responseData = await response.json();
                //alert('Referral created successfully!');
                window.location.href = `/analytics/referrals/${responseData.local_referral_id}/`;

            } catch (error) {
                alert(`Error: ${error.message}`);
                console.error('Referral creation error:', error);
                createReferralBtn.disabled = false;
                createReferralBtn.textContent = 'Create Referral';
            }
        });

        // Initial Load
        loadFormState();
        sortProviderDropdown().then(() => {
            const storedProvider = sessionStorage.getItem(STORAGE_KEYS.PROVIDER);
            if (storedProvider) {
                providerSelect.value = storedProvider;
                autoPopulateSpecialty();
                fetchAndPopulateDepartments(storedProvider).then(() => {
                    fetchAndRenderCalendar(currentDate.getFullYear(), currentDate.getMonth());
                });
            } else {
                fetchAndRenderCalendar(currentDate.getFullYear(), currentDate.getMonth());
            }
        });
    });
</script>
{% endblock %}
